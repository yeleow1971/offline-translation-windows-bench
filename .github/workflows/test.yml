name: Manual free Windows translation QA

"on":
  workflow_dispatch:
    inputs:
      model:
        description: Pinned public offline model
        type: choice
        required: true
        default: hymt7b
        options: [hymt7b, qwen9b, hymt7b-domain, gemma12b]

permissions:
  contents: read

concurrency:
  group: manual-windows-model-qa
  cancel-in-progress: false

jobs:
  model-test:
    # Evaluated BEFORE allocation. A private fork never allocates a paid runner.
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.repository.private == false }}
    runs-on: windows-2022
    timeout-minutes: 75
    env:
      PYTHONUTF8: "1"
      BENCH_MODEL: ${{ inputs.model }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Prepare checksum-pinned public runtime
        run: python bootstrap.py
      - name: Verify files, CPU runtime and owned child cleanup
        run: python benchmark.py --self-check --model "$env:BENCH_MODEL"
      - name: Test original synthetic cases in three languages
        run: python benchmark.py --model "$env:BENCH_MODEL" --output-name "cloud-$env:BENCH_MODEL"
      - name: Preserve small JSON results in ordinary logs
        if: always()
        run: python bootstrap.py --emit-results
